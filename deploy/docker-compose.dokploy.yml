# Dokploy-friendly compose for AI Markets Hermes dashboard.
#
# Root cause of the "Input is not a terminal (fd=0) / Shutting down" crash:
# empty/default CMD runs interactive `hermes` chat. Non-TTY stdin exits →
# s6 tears down dashboard too.
#
# Fix: keep PID 1 alive with sleep infinity; dashboard is an s6 service
# gated by HERMES_DASHBOARD=1 (empty CMD runs interactive hermes → exit → 502).
#
# Dokploy → Application:
#   Provider: Docker Compose
#   Compose path: deploy/docker-compose.dokploy.yml
#   OR Nixpacks/Dockerfile with Command override:
#     sleep infinity
#   AND env HERMES_DASHBOARD=1
#
# Environment (required):
#   HERMES_DASHBOARD=1
#   HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=<strong>
#   HERMES_AIMARKETS_API_URL=https://api.aimarkets.vn
#   AIMARKETS_SERVICE_SECRET=<same as marketplace API>

services:
  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    ports:
      - "9119:9119"
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      # s6 dashboard slot (required — without this, dashboard exits immediately).
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # Admin/operator only — buyers use aimarkets provider below.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # Per-buyer Launch autofill + profile lock (market-{userId}).
      HERMES_AIMARKETS_API_URL: ${HERMES_AIMARKETS_API_URL:-https://api.aimarkets.vn}
      AIMARKETS_SERVICE_SECRET: ${AIMARKETS_SERVICE_SECRET:?set AIMARKETS_SERVICE_SECRET}
      # Wallet billing (plugins/aimarkets_usage → POST /v1/hermes/usage).
      # HERMES_AIMARKETS_MARKUP: ${HERMES_AIMARKETS_MARKUP:-0.25}
      # Inference providers (Dokploy → Environment). At least one is required
      # for buyer chat. Keys are mirrored into each market-{userId} profile
      # .env on login (OPENROUTER_* is profile-scoped, not process-global).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-}
    # Keep container alive. Dashboard is supervised by s6 when HERMES_DASHBOARD=1.
    # Do NOT use interactive `hermes` / empty CMD — no TTY → exit → Traefik 502.
    command: ["sleep", "infinity"]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  hermes-data:
