# Dokploy-friendly compose for AI Markets Hermes dashboard.
#
# Root cause of the "Input is not a terminal (fd=0) / Shutting down" crash:
# empty/default CMD runs interactive `hermes` chat. Non-TTY stdin exits →
# s6 tears down dashboard too.
#
# Fix: CMD must be `dashboard …` (or `sleep infinity` + HERMES_DASHBOARD=1).
#
# Dokploy → Application:
#   Provider: Docker Compose
#   Compose path: deploy/docker-compose.dokploy.yml
#   OR Nixpacks/Dockerfile with Command override:
#     dashboard --host 0.0.0.0 --port 9119 --no-open
#
# Environment (required):
#   HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=<strong>

services:
  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    ports:
      - "9119:9119"
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      # Required for --host 0.0.0.0 (auth gate fail-closed without these).
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # Optional model keys:
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-}
    # Main process = dashboard (not interactive chat). Keeps container alive.
    command:
      [
        "dashboard",
        "--host",
        "0.0.0.0",
        "--port",
        "9119",
        "--no-open",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  hermes-data:
