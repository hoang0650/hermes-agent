# Dokploy → dynamic/hermes-aimarkets-wildcard.yml
# DNS: hermes + *.hermes A → 72.62.72.165
# TLS pattern = same as ai.aimarkets.vn (denglish): web+websecure, LE HTTP-01

http:
  routers:
    hermes-aimarkets-shared-http:
      rule: "Host(`hermes.aimarkets.vn`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: hermes-aimarkets-svc
      priority: 200

    hermes-aimarkets-shared-https:
      rule: "Host(`hermes.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: hermes-aimarkets-svc
      priority: 200
      tls:
        certResolver: letsencrypt
        domains:
          - main: "hermes.aimarkets.vn"

    hermes-aimarkets-tenant-http:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.hermes\\.aimarkets\\.vn$`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: hermes-aimarkets-svc
      priority: 50

    hermes-aimarkets-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.hermes\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: hermes-aimarkets-svc
      priority: 50
      tls:
        certResolver: letsencrypt

  services:
    hermes-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://aimarketplace-hermes-nxdss5:9119"
        passHostHeader: true
