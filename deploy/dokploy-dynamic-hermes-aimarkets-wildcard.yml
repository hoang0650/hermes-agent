# Paste → Dokploy → Traefik File System → dynamic/hermes-aimarkets-wildcard.yml
#
# AI Markets Hermes dashboard (parallel to OpenClaw wildcard).
#
# DNS (Mắt Bão):
#   hermes.aimarkets.vn     A  → 72.62.72.165
#   *.hermes.aimarkets.vn   A  → 72.62.72.165   (host = *.hermes)
#
# Host: {userId}.hermes.aimarkets.vn  (userId = Mongo ObjectId 24 hex)
# Upstream: Hermes web dashboard (default port 9119). Update service name/port if needed.

http:
  routers:
    hermes-aimarkets-wildcard-http:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.hermes\\.aimarkets\\.vn$`)"
      entryPoints:
        - web
      service: hermes-wildcard-svc
      priority: 50

    hermes-aimarkets-wildcard-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.hermes\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: hermes-wildcard-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    hermes-aimarkets-shared-http:
      rule: "Host(`hermes.aimarkets.vn`)"
      entryPoints:
        - web
      service: hermes-wildcard-svc
      priority: 200

    hermes-aimarkets-shared-https:
      rule: "Host(`hermes.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: hermes-wildcard-svc
      tls:
        certResolver: letsencrypt
        domains:
          - main: "hermes.aimarkets.vn"
      priority: 200

  services:
    hermes-wildcard-svc:
      loadBalancer:
        servers:
          - url: "http://hermes-dashboard:9119"
