# Dokploy → Traefik File System → folder dynamic → tạo file mới
#   hermes-aimarkets-wildcard.yml
# KHÔNG dán vào traefik.yml.
#
# DNS: hermes + *.hermes  A → 72.62.72.165
# Hermes Command phải là: dashboard --host 0.0.0.0 --port 9119 --no-open
# + HERMES_DASHBOARD_BASIC_AUTH_USERNAME / _PASSWORD

http:
  routers:
    hermes-aimarkets-wildcard-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.hermes\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: hermes-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    hermes-aimarkets-shared-https:
      rule: "Host(`hermes.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: hermes-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 200

  services:
    hermes-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://aimarketplace-hermes-nxdss5:9119"
        passHostHeader: true
